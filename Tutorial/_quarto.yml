project:
  type: book

book:
  title: "Mobile Multimodal Lab: An Open-Source, Low-Cost, and Portable Laboratory for the Study of Multimodal Behavior"
  chapters:
    - index.qmd           # title page 
    - Introduction.qmd 
    - Method-overview.qmd
    - Method-experiment.qmd
    - Method-labsetup.qmd
    - Method-preprocessing.qmd
    - Method-processing.qmd
    - Analysis.qmd
    - Results.qmd
    - Discussion.qmd
    - Outro.qmd
    - References.qmd
  
crossref: 
  chapters: true
format:
  docx:
    number-offset: [-1]
    reference-doc: reference-style.docx    # your custom reference template (see below)
    number-sections: true
    number-depth: 3          
    fig-cap-location: bottom
    tbl-cap-location: top
    keep-md: false
    highlight-style: none
    toc: false
    linestretch: 2

language:
  crossref-ch-prefix: "Section"
    
