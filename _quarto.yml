  sidebar:
    style: "floating"
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - text: "I. Introduction"
        href: Tutorial/Introduction.qmd

      - section: "II. Methods"
        contents:
          - text: "Overview"
            href: Tutorial/Method-overview.qmd
          - text: "Experimental design"
            href: Tutorial/Method-experiment.qmd 
          - text: "Lab Setup"
            href: Tutorial/Method-labsetup.qmd
          - text: "Processing"
            href: Tutorial/Method-preprocessing.qmd
          - text: "Motion tracking"
            href: Tutorial/Method-processing.qmd

      - text: "III. Analysis"
        href: Tutorial/Analysis.qmd
      - text: "IV. Results"
        href: Tutorial/Results.qmd
      - text: "V. Conclusions"
        href: Tutorial/Discussion.qmd

  navbar:
