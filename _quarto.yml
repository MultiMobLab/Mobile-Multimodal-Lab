project:
  type: website
  output-dir: docs
  # Run: quarto render                  → HTML tutorial (default)
  # Run: quarto render --profile manuscript → PDF manuscript
  # Run: python sync_gdocs.py upload    → push all .qmd to Google Docs for review
  # Run: python sync_gdocs.py download  → pull edits back

website:
  title: "Mobile Multimodal Lab" 
  description: "Tutorial for an Open-Source, Low-Cost, and Portable Laboratory for the Study of Multimodal Behavior"
  sidebar:
    style: "floating"
    search: true
    contents:
      - text: "Home"
        href: Tutorial/index.qmd
      - section: "Introduction"
        href: Tutorial/Introduction.qmd

      - section: "Methods"
        contents:
          - text: "Overview"
            href: Tutorial/Method-overview.qmd
          - text: "Experimental design"
            href: Tutorial/Method-experiment.qmd 
          - text: "Lab Setup"
            href: Tutorial/Method-labsetup.qmd
          - text: "Processing"
            href: Tutorial/Method-preprocessing.qmd
          - text: "Motion tracking"
            href: Tutorial/Method-processing.qmd

      - section: "Analysis"
        contents:
          - text: "Overview"
            href: Tutorial/Analysis.qmd


  navbar:
    tools:
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/MultiMobLab/Mobile-Multimodal-Lab
          - text: Report a Bug
            href: https://github.com/MultiMobLab/Mobile-Multimodal-Lab/issues

author:
  - name: Davide Ahmar
    affiliations:
      - name: Max-Planck Institute for Human Development, Berlin
      - name: Humboldt University in Berlin
      - name: Donders Institute for Brain, Cognition, and Behaviour, Radboud University
  - name: Wim Pouw
    affiliations:
      - name: Department of Computational Cognitive Science, Research Center for Cognitive Science and AI, Tilburg University
      - name: Donders Institute for Brain, Cognition, and Behaviour, Radboud University
  - name: Šárka Kadavá
    affiliations:
      - name: Leibniz-Centre for General Linguistics (ZAS)
      - name: Donders Institute for Brain, Cognition, and Behaviour, Radboud University
      - name: Georg-August-Universität Göttingen

# Default format: HTML tutorial (full code + all sections)
format:
  html:
    theme: lux
    highlight-style: github
    css: styles.css
    toc: true
    number-sections: true
    code-fold: true          # code visible but collapsible by default
    code-tools: true         # copy button, show/hide all
    code-link: true

# Default execution: run and show code in HTML
execute:
  echo: false
  eval: false
  warning: false
  message: false
  cache: false                # cache outputs so re-renders are fast
